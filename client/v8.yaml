# ╔════════════════════════════════════════════════════════════════════╗
# ║        Mihomo 日常分流配置 · 桌面与移动客户端通用版  v8          ║
# ╠════════════════════════════════════════════════════════════════════╣
# ║  适用：Clash Verge Rev、Clash Party、FlClash 等 Mihomo 客户端     ║
# ║  保留：应用分流、地区故障转移、机场梯队与原有健康检查参数         ║
# ║  移除：OpenWrt 多网段入口、全局网段、住宅 IP、HTTP 7891 入站       ║
# ║  使用前：填写 5 个 proxy-provider 订阅 URL 与本机控制器 secret    ║
# ╚════════════════════════════════════════════════════════════════════╝
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# 一、全局配置
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
mode: rule
mixed-port: 7890
allow-lan: false
bind-address: "127.0.0.1"
ipv6: false
unified-delay: true
tcp-concurrent: true
log-level: warning
keep-alive-idle: 600
keep-alive-interval: 15

profile:
  store-selected: true
  store-fake-ip: true

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# 二、Web 控制面板
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
external-controller: 127.0.0.1:9090
secret: ""

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# 三、流量嗅探
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"
    - "+.apple.com"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# 四、TUN 入站（客户端接管本机流量）
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
tun:
  enable: true
  stack: mixed
  dns-hijack:
    - "any:53"
    - "tcp://any:53"
  auto-route: true
  auto-detect-interface: true

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# 五、DNS 配置（防泄漏 + 国内外分流解析）
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
dns:
  enable: true
  cache-algorithm: arc
  listen: 127.0.0.1:1053
  ipv6: false
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist

  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - system

  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query

  direct-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  direct-nameserver-follow-policy: false

  nameserver:
    - https://8.8.8.8/dns-query#RULES&ecs=223.5.5.0/24
    - https://1.1.1.1/dns-query#RULES

  fake-ip-filter:
    - "rule-set:fakeipfilter"
    - "*.lan"
    - "*.local"
    - "*.localhost"
    - "+.stun.*.*"
    - "+.stun.*.*.*"
    - "time.*.com"
    - "time.*.gov"
    - "ntp.*.com"
    - "localhost.ptlogin2.qq.com"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# 六、机场订阅（proxy-providers）
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# ┌─────────────────────────────────────────────────────────────┐
# │ 梯队分配（调整梯队只需移动机场名到对应锚点的 use: 列表）   │
# │                                                             │
# │ 主力 C：AirportC1 + AirportC2 → 日常大流量主力              │
# │ 保底 B：AirportB1 + AirportB2 → 最便宜，C挂了兜底           │
# │ 优质 A：AirportA → 最贵最稳，AI专用                         │
# └─────────────────────────────────────────────────────────────┘
# ┌─────────────────────────────────────────────────────────────┐
# │ 使用说明（重要）：                                         │
# │ · 5 个 provider 是通用槽位，把你自己机场的订阅 URL 填进   │
# │   各 provider 的 url（替换 YOUR_TOKEN）即可，无需改名      │
# │ · 机场不足 5 个：删除多余的 provider，并同步把它从对应     │
# │   锚点 use: 列表里移除（见下方「代理组锚点」）             │
# │ · 想调整梯队归属：移动 use: 列表里的名字，其余不用改       │
# └─────────────────────────────────────────────────────────────┘
proxy-providers:
  # ── 主力梯队 C ─────────────────────────────────────────────
  AirportC1:
    type: http
    url: "https://example.com/airport-c1/subscribe?token=YOUR_TOKEN"
    interval: 86400
    override:
      client-fingerprint: chrome
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      expected-status: 204
      interval: 300
      timeout: 5000
      lazy: true
    proxy: DIRECT
    exclude-filter: "流量|套餐|到期|剩余|重置|官网|网站|最新网址|防失联|失联|公告|通知|TG|Telegram|群|频道|说明|QQ群|客服|工单|订阅|Expire|Traffic|Reset|Remaining|Official"

  AirportC2:
    type: http
    url: "https://example.com/airport-c2/subscribe?token=YOUR_TOKEN"
    interval: 86400
    override:
      client-fingerprint: chrome
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      expected-status: 204
      interval: 300
      timeout: 5000
      lazy: true
    proxy: DIRECT
    exclude-filter: "流量|套餐|到期|剩余|重置|官网|网站|最新网址|防失联|失联|公告|通知|TG|Telegram|群|频道|说明|QQ群|客服|工单|订阅|Expire|Traffic|Reset|Remaining|Official"

  # ── 保底梯队 B ─────────────────────────────────────────────
  AirportB1:
    type: http
    url: "https://example.com/airport-b1/subscribe?token=YOUR_TOKEN"
    interval: 86400
    override:
      client-fingerprint: chrome
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      expected-status: 204
      interval: 300
      timeout: 5000
      lazy: true
    proxy: DIRECT
    exclude-filter: "流量|套餐|到期|剩余|重置|官网|网站|最新网址|防失联|失联|公告|通知|TG|Telegram|群|频道|说明|QQ群|客服|工单|订阅|Expire|Traffic|Reset|Remaining|Official"

  AirportB2:
    type: http
    url: "https://example.com/airport-b2/subscribe?token=YOUR_TOKEN"
    interval: 86400
    override:
      client-fingerprint: chrome
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      expected-status: 204
      interval: 300
      timeout: 5000
      lazy: true
    proxy: DIRECT
    exclude-filter: "流量|套餐|到期|剩余|重置|官网|网站|最新网址|防失联|失联|公告|通知|TG|Telegram|群|频道|说明|QQ群|客服|工单|订阅|Expire|Traffic|Reset|Remaining|Official"

  # ── 优质梯队 A ─────────────────────────────────────────────
  # ⚠️ 排查指引：如果面板不显示某机场节点，请检查：
  #   1. 在路由器终端执行 curl -I "订阅URL" 看是否能访问
  #   2. 如果返回超时/拒绝，说明域名被墙，尝试把 proxy: DIRECT 改为 proxy: AirportC1（借道主力机场拉取）
  #   3. 确认订阅 token 未过期
  #   4. 确认 exclude-filter 没有过滤掉所有节点（临时注释掉 exclude-filter 测试）
  AirportA:
    type: http
    url: "https://example.com/airport-a/subscribe?token=YOUR_TOKEN"
    interval: 86400
    override:
      client-fingerprint: chrome
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      expected-status: 204
      interval: 120
      timeout: 5000
      lazy: true
    proxy: DIRECT
    exclude-filter: "流量|套餐|到期|剩余|重置|官网|网站|最新网址|防失联|失联|公告|通知|TG|Telegram|群|频道|说明|QQ群|客服|工单|订阅|Expire|Traffic|Reset|Remaining|Official"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# 七、代理组锚点
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# ┌─────────────────────────────────────────────────────────────┐
# │ 调整梯队归属：把机场名从一个 use: 移到另一个即可            │
# │ 例：AirportB2 从保底移到主力 → sub_ut_c.use 加 AirportB2,      │
# │     sub_ut_b.use 删 AirportB2，其余全部不用改                  │
# └─────────────────────────────────────────────────────────────┘
# 主力梯队子组：跨 AirportC1 + AirportC2 选最快节点
sub_ut_c: &sub_ut_c
  type: url-test
  use: [AirportC1, AirportC2]
  url: https://www.gstatic.com/generate_204
  expected-status: 204
  interval: 300
  timeout: 5000
  tolerance: 50

# 保底梯队子组：跨 AirportB1 + AirportB2 选最快节点
sub_ut_b: &sub_ut_b
  type: url-test
  use: [AirportB1, AirportB2]
  url: https://www.gstatic.com/generate_204
  expected-status: 204
  interval: 300
  timeout: 5000
  tolerance: 50

# 优质梯队子组：AirportA 内选最快节点（tolerance 调高减少切换，AI 长对话不怕慢怕断）
sub_ut_a: &sub_ut_a
  type: url-test
  use: [AirportA]
  url: https://www.gstatic.com/generate_204
  expected-status: 204
  interval: 300
  timeout: 5000
  tolerance: 100

# 省流版地区 fallback：C→B→A（主力先上，保底兜底，优质最后）
region_eco: &region_eco
  type: fallback
  url: https://www.gstatic.com/generate_204
  expected-status: 204
  interval: 60
  timeout: 5000
  max-failed-times: 2

# 稳定版地区 fallback：A→C→B（优质先上，主力次之，保底最后）
region_pro: &region_pro
  type: fallback
  url: https://www.gstatic.com/generate_204
  expected-status: 204
  interval: 60
  timeout: 5000
  max-failed-times: 2

# 全机场 url-test（次要地区用，覆盖全部 5 个机场）
all_ut: &all_ut
  type: url-test
  include-all-providers: true
  url: https://www.gstatic.com/generate_204
  expected-status: 204
  interval: 300
  timeout: 5000
  tolerance: 20

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# 八、代理组（策略组）
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#
# ┌─────────────────────────────────────────────────────────────┐
# │ 面板显示顺序（最常用的排最前）                               │
# │  第1区：出口组（2个）                                        │
# │  第2区：应用策略组（24个，日常操作区）                       │
# │  第3区：地区组（19个，跨国兜底直接展开）                     │
# │  第4区：机场子组（基础设施，15个，沉底，几乎不需要手动碰）   │
# └─────────────────────────────────────────────────────────────┘

proxy-groups:
  # ══════════════════════════════════════════════════════════════
  # 【第1区】出口组（2个）
  # ══════════════════════════════════════════════════════════════

  # 默认出口：稳定版★（A→C→B）置顶 + 省流版（C→B→A）五地可选，面板自定义范围更大
  - name: "🚀 默认出口 客户端"
    type: select
    proxies:
      - "🇭🇰 香港★"
      - "🇯🇵 日本★"
      - "🇸🇬 新加坡★"
      - "🇺🇸 美国★"
      - "🇹🇼 台湾★"
      - "🇭🇰 香港"
      - "🇯🇵 日本"
      - "🇸🇬 新加坡"
      - "🇺🇸 美国"
      - "🇹🇼 台湾"
      - "🇬🇧 英国"
      - "🇩🇪 德国"
      - "🇫🇷 法国"
      - "🇰🇷 韩国"
      - "🌐 全部节点"
      - "🔯 故障转移"
      - DIRECT

  # 全局代理：与默认出口一致，★稳定置顶 + 省流五地 + 次要地区（面板可切省流）
  - name: "🐟 漏网之鱼"
    type: select
    proxies:
      - "🚀 默认出口 客户端"
      - "🔯 故障转移"
      - "🌐 全部节点"
      - DIRECT

  # ══════════════════════════════════════════════════════════════
  # 【第2区】应用策略组（当前设备的日常规则分流）
  #
  #  规则：
  #  · AI 类  → 默认 ★稳定；列表中追加省流版供临时省钱
  #  · 视频类 → 默认省流；列表中追加 ★稳定供解锁/卡顿切换
  #  · 其他类 → 默认省流；列表中追加 ★稳定扩大自选
  #  · Steam  → DIRECT 优先，完全不消耗机场流量
  # ══════════════════════════════════════════════════════════════

  # ─────────────────────────────────
  # AI 平台（稳定优先，引用 ★ 版地区）
  # ─────────────────────────────────

  - name: "🤖 Claude 客户端"
    type: select
    proxies:
      - "🇯🇵 日本★"
