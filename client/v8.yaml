    <<: *sub_ut_b
    filter: "(?=.*(美|US|(?i)States|America))^((?!(港|台|日|韩|新|韓)).)*$"

  - name: "[A] 美国"
    <<: *sub_ut_a
    filter: "(?=.*(美|US|(?i)States|America))^((?!(港|台|日|韩|新|韓)).)*$"

  # ── 台湾子组 ─────────────────────────────────────────────────
  - name: "[C] 台湾"
    <<: *sub_ut_c
    filter: "(?=.*(台|TW|(?i)Taiwan|Taipei))^((?!(港|日|韩|新|美|韓)).)*$"

  - name: "[B] 台湾"
    <<: *sub_ut_b
    filter: "(?=.*(台|TW|(?i)Taiwan|Taipei))^((?!(港|日|韩|新|美|韓)).)*$"

  - name: "[A] 台湾"
    <<: *sub_ut_a
    filter: "(?=.*(台|TW|(?i)Taiwan|Taipei))^((?!(港|日|韩|新|美|韓)).)*$"

