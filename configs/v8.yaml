# ╔══════════════════════════════════════════════════════════════════════╗
# ║        Mihomo 多网段精细分流配置 · OpenWrt 定制版 v8 · 说明书      ║
# ╠══════════════════════════════════════════════════════════════════════╣
# ║  【使用流程】                                                        ║
# ║  1. 复制为 configs/v8.local.yaml（不要直接改本模板。）                 ║
# ║  2. 编辑器按 Ctrl + F（Mac: Cmd + F）搜索 ◆，依次跳到每个必填项        ║
# ║  3. 语法检查：clash_meta -t -f v8.local.yaml                          ║
# ║  4. 上传 OpenClash 启用，按 README「怎么部署」验收                    ║
# ╠══════════════════════════════════════════════════════════════════════╣
# ║  【必填 ①】5 个机场订阅（proxy-providers）                            ║
# ║  · 槽位：AirportC1/C2 = 主力  AirportB1/B2 = 保底  AirportA = 优质   ║
# ║  · 把订阅 URL 直接填进各槽位 url 即可，槽位名无需改                     ║
# ║  · 机场不足 5 个：删除多余 provider 块，并把它从锚点 use: 列表移除  ║
# ║  · 调整梯队：把名字在 use: 列表之间移动即可                          ║
# ╠══════════════════════════════════════════════════════════════════════╣
# ║  【可选 ②】HTTP 7891 入站（listeners，默认启用，不影响日常使用）      ║
# ║  · 用途：给爬虫/自动化程序用的独立 HTTP 代理入口（带账号密码）      ║
# ║  · 出口：HTTP 各组默认引用 32.x 同名平台组——面板选哪个地区就走     ║
# ║    哪个，与 32.x 设备共享出口 IP；也可单独改 HTTP 组换地区          ║
# ║  · 不用：整块删除 listeners 段；留着建议改掉默认密码               ║
# ╠══════════════════════════════════════════════════════════════════════╣
# ║  【可选 ③】34.x 住宅代理（proxies）                                   ║
# ║  · 是什么：静态住宅 IP（socks5 协议），34.x 网段全部流量默认走它      ║
# ║  · 怎么填：把 YOUR_RESIDENTIAL_HOST / YOUR_RESIDENTIAL_USER /        ║
# ║    YOUR_RESIDENTIAL_PASS 换成服务商给的地址、用户名、密码            ║
# ║    （端口默认 8001，按服务商实际端口修改）                           ║
# ║  · 适合：严格风控站点、账号登录、远程连接等需要住宅出口的场景       ║
# ║  · 白名单：34.x 内直连的域名/IP 名单在 configs/rulesets/DIRECT-34*.yaml ║
# ║  · 不用：整块删除 proxies；没有真实住宅代理前 34.x 网段不可用       ║
# ║  【可选 ④】个人直连域名/IP（configs/rulesets/*.yaml，作者示例请替换）║
# ╠══════════════════════════════════════════════════════════════════════╣
# ║  【内置行为】国内直连、海外按平台分流、同国故障切换、跨国兜底        ║
# ║  · 跨国兜底不含香港；★=稳定版 A→C→B，无★=省流版 C→B→A               ║
# ╠══════════════════════════════════════════════════════════════════════╣
# ║  【网段】31.x 全部直连 | 32.x 规则分流 | 33.x 全局代理 | 34.x 住宅   ║
# ║  【网段】Wi-Fi/接口/DHCP 需在 OpenWrt 自行创建，本文件只负责分流     ║
# ║  【入口】HTTP 7891 爬虫专用，出口默认跟随 32.x 面板选择的地区       ║
# ╠══════════════════════════════════════════════════════════════════════╣
# ║  【面板】出口组 → HTTP策略组 → 应用策略组 → 地区组 → 机场子组      ║
# ║  【排障】先看运行日志；某机场没节点查订阅 URL 与 Token 是否有效      ║
# ║  【排障】地区组为空→节点名不匹配 filter；0ms 多为 lazy 尚未测速     ║
# ╚══════════════════════════════════════════════════════════════════════╝

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# 一、全局配置
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
mixed-port: 7890
allow-lan: true
bind-address: "*"
ipv6: false
unified-delay: true
tcp-concurrent: true
log-level: warning
keep-alive-idle: 600
keep-alive-interval: 15

profile:
  store-selected: true
  store-fake-ip: true

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# 二、Web 控制面板
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
external-controller: 0.0.0.0:9090
secret: ""
external-ui: ui
external-ui-name: zashboard
external-ui-url: "https://github.com/Zephyruso/zashboard/archive/refs/heads/gh-pages.zip"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# 三、流量嗅探
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"
    - "+.apple.com"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# 四、TUN 入站（OpenWrt 透明代理）
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
tun:
  enable: true
  stack: mixed
  dns-hijack:
    - "any:53"
    - "tcp://any:53"
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# 四-B、HTTP 入站（v7 新增，爬虫防封控专用）
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# ┌─────────────────────────────────────────────────────────────┐
# │ HTTP 入站绑定独立 sub-rules（http-rules），                  │
# │ 实现与 TUN 透明代理完全隔离的精细化分流。                    │
# │ 所有 HTTP 用户流量按目标平台分层管理，防 IP 封控。          │
# │                                                             │
# │ 安全建议：                                                  │
# │ · 密码使用强密码，定期更换                                  │
# │ · 防火墙限制 7891 端口仅允许内网访问                       │
# │ · 生产环境建议启用 TLS（取消注释 certificate/private-key）  │
# └─────────────────────────────────────────────────────────────┘
# ◆ 可选②：HTTP 7891 入站（独立 HTTP 代理入口；不用可整块删除 listeners，留着请改密码）
listeners:
  - name: http-in
    type: http
    port: 7891
    listen: 0.0.0.0
    rule: http-rules  # 绑定到专用 sub-rules
    users:
      - username: crawler1
        password: ★填写crawler1密码★
      - username: crawler2
        password: ★填写crawler2密码★
      - username: crawler3
        password: ★填写crawler3密码★
    # TLS 可选配置（按需启用）
    # certificate: ./server.crt
    # private-key: ./server.key

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# 五、DNS 配置（防泄漏 + 国内外分流解析）
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
dns:
  enable: true
  cache-algorithm: arc
  listen: 0.0.0.0:1053
  ipv6: false
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-range: 28.0.0.1/8
  fake-ip-filter-mode: blacklist

  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - system

  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query

  direct-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  direct-nameserver-follow-policy: false

  nameserver:
    - https://8.8.8.8/dns-query#RULES&ecs=223.5.5.0/24
    - https://1.1.1.1/dns-query#RULES

  fake-ip-filter:
    - "rule-set:fakeipfilter"
    - "*.lan"
    - "*.local"
    - "*.localhost"
    - "+.stun.*.*"
    - "+.stun.*.*.*"
    - "time.*.com"
    - "time.*.gov"
    - "ntp.*.com"
    - "localhost.ptlogin2.qq.com"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# 六、机场订阅（proxy-providers）
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# ┌─────────────────────────────────────────────────────────────┐
# │ 梯队分配（调整梯队只需移动机场名到对应锚点的 use: 列表）   │
# │                                                             │
# │ 主力 C：AirportC1 + AirportC2 → 日常大流量主力              │
# │ 保底 B：AirportB1 + AirportB2 → 最便宜，C挂了兜底           │
# │ 优质 A：AirportA → 最贵最稳，AI专用                         │
# └─────────────────────────────────────────────────────────────┘
# ┌─────────────────────────────────────────────────────────────┐
# │ 使用说明（重要）：                                         │
# │ · 5 个 provider 是通用槽位，把你自己机场的订阅 URL 填进   │
# │   各 provider 的 url（替换 YOUR_TOKEN）即可，无需改名      │
# │ · 机场不足 5 个：删除多余的 provider，并同步把它从对应     │
# │   锚点 use: 列表里移除（见下方「代理组锚点」）             │
# │ · 想调整梯队归属：移动 use: 列表里的名字，其余不用改       │
# └─────────────────────────────────────────────────────────────┘
# ◆ 必填①：5 个机场订阅，把订阅 URL 填进各槽位 url（Ctrl + F 搜索 ◆ 依次跳转）
proxy-providers:
  # ── 主力梯队 C ─────────────────────────────────────────────
  AirportC1:
    type: http
    url: "https://example.com/airport-c1/subscribe?token=YOUR_TOKEN"
    interval: 86400
    override:
      client-fingerprint: chrome
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      expected-status: 204
      interval: 300
      timeout: 5000
      lazy: true
    proxy: DIRECT
    exclude-filter: "流量|套餐|到期|剩余|重置|官网|网站|最新网址|防失联|失联|公告|通知|TG|Telegram|群|频道|说明|QQ群|客服|工单|订阅|Expire|Traffic|Reset|Remaining|Official"

  AirportC2:
    type: http
    url: "https://example.com/airport-c2/subscribe?token=YOUR_TOKEN"
    interval: 86400
    override:
      client-fingerprint: chrome
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      expected-status: 204
      interval: 300
      timeout: 5000
      lazy: true
    proxy: DIRECT
    exclude-filter: "流量|套餐|到期|剩余|重置|官网|网站|最新网址|防失联|失联|公告|通知|TG|Telegram|群|频道|说明|QQ群|客服|工单|订阅|Expire|Traffic|Reset|Remaining|Official"

  # ── 保底梯队 B ─────────────────────────────────────────────
  AirportB1:
    type: http
    url: "https://example.com/airport-b1/subscribe?token=YOUR_TOKEN"
    interval: 86400
    override:
      client-fingerprint: chrome
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      expected-status: 204
      interval: 300
      timeout: 5000
      lazy: true
    proxy: DIRECT
    exclude-filter: "流量|套餐|到期|剩余|重置|官网|网站|最新网址|防失联|失联|公告|通知|TG|Telegram|群|频道|说明|QQ群|客服|工单|订阅|Expire|Traffic|Reset|Remaining|Official"

  AirportB2:
    type: http
    url: "https://example.com/airport-b2/subscribe?token=YOUR_TOKEN"
    interval: 86400
    override:
      client-fingerprint: chrome
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      expected-status: 204
      interval: 300
      timeout: 5000
      lazy: true
    proxy: DIRECT
    exclude-filter: "流量|套餐|到期|剩余|重置|官网|网站|最新网址|防失联|失联|公告|通知|TG|Telegram|群|频道|说明|QQ群|客服|工单|订阅|Expire|Traffic|Reset|Remaining|Official"

  # ── 优质梯队 A ─────────────────────────────────────────────
  # ⚠️ 排查指引：如果面板不显示某机场节点，请检查：
  #   1. 在路由器终端执行 curl -I "订阅URL" 看是否能访问
  #   2. 如果返回超时/拒绝，说明域名被墙，尝试把 proxy: DIRECT 改为 proxy: AirportC1（借道主力机场拉取）
  #   3. 确认订阅 token 未过期
  #   4. 确认 exclude-filter 没有过滤掉所有节点（临时注释掉 exclude-filter 测试）
  AirportA:
    type: http
    url: "https://example.com/airport-a/subscribe?token=YOUR_TOKEN"
    interval: 86400
    override:
      client-fingerprint: chrome
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      expected-status: 204
      interval: 120
      timeout: 5000
      lazy: true
    proxy: DIRECT
    exclude-filter: "流量|套餐|到期|剩余|重置|官网|网站|最新网址|防失联|失联|公告|通知|TG|Telegram|群|频道|说明|QQ群|客服|工单|订阅|Expire|Traffic|Reset|Remaining|Official"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# 七、静态住宅 IP（proxies）
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# ◆ 可选③：34.x 住宅代理（把 YOUR_RESIDENTIAL_* 换成服务商给的；不用可整块删除 proxies）
proxies:
  - name: "🏠 美国住宅-34"
    type: socks5
    server: "YOUR_RESIDENTIAL_HOST"
    port: 8001
    username: "YOUR_RESIDENTIAL_USER"
    password: "YOUR_RESIDENTIAL_PASS"
    udp: true

  # - name: "🏠 英国住宅-35"
  #   type: socks5
  #   server: "★填写IP地址★"
  #   port: ★填写端口★
  #   username: "★填写用户名★"
  #   password: "★填写密码★"
  #   udp: true

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# 八、代理组锚点
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# ┌─────────────────────────────────────────────────────────────┐
# │ 调整梯队归属：把机场名从一个 use: 移到另一个即可            │
# │ 例：AirportB2 从保底移到主力 → sub_ut_c.use 加 AirportB2,      │
# │     sub_ut_b.use 删 AirportB2，其余全部不用改                  │
# └─────────────────────────────────────────────────────────────┘
p_select: &p_select
  type: select

# 主力梯队子组：跨 AirportC1 + AirportC2 选最快节点
sub_ut_c: &sub_ut_c
  type: url-test
  use: [AirportC1, AirportC2]
  url: https://www.gstatic.com/generate_204
  expected-status: 204
  interval: 300
  timeout: 5000
  tolerance: 50

# 保底梯队子组：跨 AirportB1 + AirportB2 选最快节点
sub_ut_b: &sub_ut_b
  type: url-test
  use: [AirportB1, AirportB2]
  url: https://www.gstatic.com/generate_204
  expected-status: 204
  interval: 300
  timeout: 5000
  tolerance: 50

# 优质梯队子组：AirportA 内选最快节点（tolerance 调高减少切换，AI 长对话不怕慢怕断）
sub_ut_a: &sub_ut_a
  type: url-test
  use: [AirportA]
  url: https://www.gstatic.com/generate_204
  expected-status: 204
  interval: 300
  timeout: 5000
  tolerance: 100

# 省流版地区 fallback：C→B→A（主力先上，保底兜底，优质最后）
region_eco: &region_eco
  type: fallback
  url: https://www.gstatic.com/generate_204
  expected-status: 204
  interval: 60
  timeout: 5000
  max-failed-times: 2

# 稳定版地区 fallback：A→C→B（优质先上，主力次之，保底最后）
region_pro: &region_pro
  type: fallback
  url: https://www.gstatic.com/generate_204
  expected-status: 204
  interval: 60
  timeout: 5000
  max-failed-times: 2

# 全机场 url-test（次要地区用，覆盖全部 5 个机场）
all_ut: &all_ut
  type: url-test
  include-all-providers: true
  url: https://www.gstatic.com/generate_204
  expected-status: 204
  interval: 300
  timeout: 5000
  tolerance: 20

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# 九、代理组（策略组）
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#
