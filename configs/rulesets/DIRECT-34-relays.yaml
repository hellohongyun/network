# DIRECT-34-relays：34.x 子规则链中「先于域名 RULE-SET」加载
# Tun(UDP) 无 Sniff Host 时，与域名混在同一 RULE-SET 可能不命中端口/IP；单独文件便于维护
# 仅写 DST-PORT / IP-CIDR；源网段由当前路由器主配置的 SUB-RULE 限定
payload:
  - DST-PORT,2480
  - DST-PORT,2481
  - DST-PORT,2482
  - IP-CIDR,192.0.2.1/32,no-resolve
  - IP-CIDR,192.0.2.2/32,no-resolve
  - IP-CIDR,192.0.2.3/32,no-resolve
